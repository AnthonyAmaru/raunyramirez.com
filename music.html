<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#fff7f3" /><meta name="description" content="Rauny Ramirez — music library." /><title>Music · Rauny Ramirez</title>
    <link rel="icon" href="favicon.ico" sizes="any" /><link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" /><link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16" /><link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" /><link rel="manifest" href="site.webmanifest" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css?v=20260806-player1" /><script src="music-cloud.js?v=20260804-titleclean1" defer></script><script src="script.js?v=20260806-player1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a><header class="site-header"><a class="brand" href="index.html" aria-label="Rauny Ramirez home"><img src="logo.png" alt="" /><strong>Rauny Ramirez</strong></a><button id="menu-toggle" class="icon-button menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button><nav id="primary-nav" aria-label="Primary navigation"><a href="resume.html">Resume</a><a href="interests.html">Interests</a><a href="music.html" aria-current="page">Music</a><a href="goals.html">Goals</a></nav><button id="theme-toggle" class="icon-button" type="button" aria-label="Switch color theme">☾</button></header>
    <aside id="music-bar" class="music-bar" aria-label="Music player"><div><span>Now playing</span><strong id="now-playing">Nothing selected</strong></div><audio id="audio-player" preload="metadata"></audio><button id="previous-track" type="button" aria-label="Previous track">‹</button><button id="toggle-track" class="play-button" type="button" aria-label="Play or pause">▶</button><button id="next-track" type="button" aria-label="Next track">›</button></aside>
    <main id="main-content">
      <section class="section-shell content-section">
        <header class="section-heading"><h1>Music</h1></header>
        <div class="music-workspace">
          <section id="playlist-browser" class="playlist-browser">
            <div class="playlist-browser-heading"><h2>Playlists</h2><button id="new-playlist" class="button ghost" type="button">+ New</button></div>
            <div class="playlist-tile-grid" aria-label="Music collections">
              <button class="playlist-tile all-songs-tile" type="button" data-playlist="all"><span aria-hidden="true">♫</span><strong>All songs</strong><small><b id="all-track-count">0</b> songs</small></button>
              <div id="playlist-list" class="playlist-tile-list"></div>
            </div>
          </section>
          <section id="music-library-view" class="music-library" hidden>
            <div class="library-title">
              <div class="library-title-group"><button id="close-music-library" class="collection-back-button" type="button">← Playlists</button><h2 id="library-title">All songs</h2></div>
              <div class="library-actions"><label class="select-all-control"><input id="select-all-tracks" type="checkbox" /><span>Select all</span></label><select id="bulk-playlist-select" class="bulk-playlist-select" aria-label="Playlist for selected songs" disabled><option value="">Playlist</option></select><button id="assign-selected-tracks" class="button ghost" type="button" disabled>Add selected</button><button id="delete-selected-tracks" class="button danger" type="button" disabled>Delete</button><small id="track-count">0 songs</small></div>
            </div>
            <input id="music-file-input" type="file" accept="audio/*" multiple hidden />
            <div id="music-drop-zone" class="drop-zone music-drop" role="button" tabindex="0"><span>♫</span><div><strong>Drop files</strong></div><button id="choose-music" class="button ghost" type="button">Choose</button></div>
            <div class="track-table-wrap"><div class="track-table-head" aria-label="Music filters and sorting"><span aria-hidden="true"></span><span aria-hidden="true"></span><div class="track-column-filter"><button class="track-sort active" type="button" data-sort-column="song" aria-pressed="true">Song <span data-sort-indicator>A→Z</span></button><input id="song-filter" type="search" placeholder="Filter songs" autocomplete="off" aria-label="Filter songs" /></div><div class="track-column-filter"><button class="track-sort" type="button" data-sort-column="artist" aria-pressed="false">Artist <span data-sort-indicator>↕</span></button><select id="artist-filter" aria-label="Filter by artist"><option value="all">All artists</option></select></div><div class="track-column-filter"><button class="track-sort" type="button" data-sort-column="playlist" aria-pressed="false">Playlist <span data-sort-indicator>↕</span></button><select id="playlist-filter" aria-label="Filter by playlist"><option value="all">All playlists</option></select></div><span aria-hidden="true"></span></div><div id="track-list" class="track-list"><div class="empty-state">No music yet</div></div></div>
          </section>
        </div>
      </section>
    </main>
    <footer><strong>Rauny Ramirez</strong><span>raunyramirez.com</span></footer><div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
