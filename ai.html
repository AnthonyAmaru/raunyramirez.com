    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260803-ai1" />
    <script src="music-cloud.js?v=20260803-ai1" defer></script>
    <script src="script.js?v=20260803-ai1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Rauny Ramirez home"><img src="logo.png" alt="" /><strong>Rauny Ramirez</strong></a>
      <button id="menu-toggle" class="icon-button menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav id="primary-nav" aria-label="Primary navigation"><a href="resume.html">Resume</a><a href="interests.html">Interests</a><a href="ai.html" aria-current="page">AI</a><a href="music.html">Music</a><a href="goals.html">Goals</a></nav>
      <button id="cloud-status" class="cloud-status" type="button"><span></span>Cloud locked</button>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch color theme">☾</button>
    </header>
    <aside id="music-bar" class="music-bar" aria-label="Music player"><div><span>Now playing</span><strong id="now-playing">Nothing selected</strong></div><audio id="audio-player" preload="metadata"></audio><button id="previous-track" type="button" aria-label="Previous track">‹</button><button id="toggle-track" class="play-button" type="button" aria-label="Play or pause">▶</button><button id="next-track" type="button" aria-label="Next track">›</button></aside>
    <main id="main-content">
      <section class="section-shell content-section ai-section">
        <header class="section-heading ai-page-heading"><h1>AI</h1><button id="rauny-ai-clear" class="button ghost" type="button">Clear</button></header>
        <section class="ai-chat" aria-labelledby="rauny-ai-title">
          <header class="ai-chat-heading"><span class="ai-avatar" aria-hidden="true">AI</span><div><h2 id="rauny-ai-title">Big Pickle</h2><small>Private session</small></div></header>
          <div id="rauny-ai-thread" class="ai-thread" role="log" aria-live="polite"><div class="ai-empty"><strong>Ask anything</strong></div></div>
          <form id="rauny-ai-form" class="ai-composer">
            <label><span class="sr-only">Topic</span><select id="rauny-ai-topic"><option>General</option><option>Art</option><option>Dentistry</option><option>Travel</option><option>Books</option><option>Shopping</option><option>Music</option><option>Goals</option></select></label>
            <label class="ai-question"><span class="sr-only">Question</span><textarea id="rauny-ai-input" rows="2" maxlength="8000" placeholder="Ask a question" required></textarea></label>
            <button id="rauny-ai-send" class="button primary" type="submit">Ask</button>
          </form>
        </section>
      </section>
    </main>
    <footer><strong>Rauny Ramirez</strong><span>raunyramirez.com</span></footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
